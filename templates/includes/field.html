{# One form field. Django 5.2 adds aria-invalid and aria-describedby to the input; the ids below match. #}
<div class="mb-3">
  <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<div class="form-text" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
  {% if field.errors %}
    <div class="field-error" id="{{ field.auto_id }}_error">
      {% for error in field.errors %}<div><span aria-hidden="true">⚠</span> {{ error }}</div>{% endfor %}
    </div>
  {% endif %}
</div>
