server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # 'same-origin' would strip the Referer that OpenStreetMap tiles require.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/geo+json text/css application/javascript text/javascript;

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nginx sets these for every response; drop Django's copies.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }
}
